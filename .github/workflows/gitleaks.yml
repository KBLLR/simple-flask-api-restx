name: gitleaks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan new commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" | tar -xz
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan only new commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Commits on the pull request that are not in the base branch.
            range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ -z "${BEFORE_SHA}" ] || [ "$BEFORE_SHA" = "$zero" ]; then
            # First push of a ref. Scan commits that are not on the default branch.
            if git rev-parse --verify --quiet "origin/${DEFAULT_BRANCH}" >/dev/null; then
              range="origin/${DEFAULT_BRANCH}..${HEAD_SHA}"
            else
              range="-1"
            fi
          else
            # Commits introduced by this push.
            range="${BEFORE_SHA}..${HEAD_SHA}"
          fi
          echo "Scanning commit range: ${range}"
          gitleaks git --no-banner --redact --verbose --config .gitleaks.toml --log-opts="${range}" .
